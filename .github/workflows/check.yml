name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Deterministic tests (no paid provider)
        run: npm exec -- node --test test/recorder.test.ts test/metrics.test.ts test/server.test.ts test/pi-integration.test.ts test/viewer.test.mjs test/json-viewer.test.mjs test/history.test.mjs test/timeline.test.mjs
