name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Deterministic tests (no paid provider)
        run: npm exec -- node --test test/recorder.test.ts test/metrics.test.ts test/server.test.ts test/pi-integration.test.ts test/viewer.test.mjs test/json-viewer.test.mjs test/history.test.mjs test/timeline.test.mjs
